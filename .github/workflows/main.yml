name: Unpack RAR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check RAR
        run: |
          echo "Files in repository:"
          ls -lah

          if [ ! -f "beldi-ai.rar" ]; then
            echo "ERROR: beldi-ai.rar not found!"
            exit 1
          fi

          echo "RAR found:"
          ls -lh "beldi-ai.rar"

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract RAR
        run: |
          rm -rf extracted-folder
          mkdir extracted-folder

          7z x "beldi-ai.rar" -oextracted-folder -y

      - name: Remove nested Git files
        run: |
          rm -rf extracted-folder/.git
          find extracted-folder -type d -name ".git" -prune -exec rm -rf {} +

      - name: Move project to repository root
        run: |
          cp -r extracted-folder/. .
          rm -rf extracted-folder

      - name: Remove RAR
        run: |
          rm -f "beldi-ai.rar"

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"

          git add -A

          git diff --cached --quiet || git commit -m "Extract Beldi AI project from RAR"

          git push
